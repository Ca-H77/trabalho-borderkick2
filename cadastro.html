<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de torcedor — BorderKick</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">BK</span><span>Border<span class="lime">Kick</span></span></a><nav><a href="index.html">Início</a><a href="pacote.html">Pacotes</a></nav><a class="text-link" href="login.html">Já tenho conta →</a></header><main class="form-page"><aside class="form-photo"><span class="eyebrow">TORCEDOR, PREPARE-SE</span><h1>O mundo inteiro<br>pode ser sua arquibancada.</h1><p>Cadastre seus dados para começar a planejar sua viagem.</p></aside><section class="form-card"><div class="steps"><span class="step active">1 <small>Dados pessoais</small></span><span class="step">2 <small>Documentos</small></span><span class="step">3 <small>Confirmação</small></span></div><h2>Cadastro de torcedor</h2><p class="muted">Preencha os campos para iniciar seu cadastro.</p><form class="demo-form" data-message="Cadastro demonstrativo enviado. Para salvar de verdade, conecte o formulário ao backend e ao banco de dados."><div class="input-grid"><div class="field full"><label for="nome">Nome completo *</label><input id="nome" required placeholder="Seu nome completo"></div><div class="field"><label for="cpf">CPF *</label><input id="cpf" required placeholder="000.000.000-00" inputmode="numeric"></div><div class="field"><label for="emailcad">E-mail *</label><input id="emailcad" type="email" required placeholder="voce@email.com"></div><div class="field"><label for="telefone">Telefone *</label><input id="telefone" required placeholder="(00) 00000-0000"></div><div class="field"><label for="nascimento">Data de nascimento *</label><input id="nascimento" type="date" required></div><div class="field full"><label for="pais">País de origem *</label><select id="pais" required><option value="">Selecione</option><option>Brasil</option><option>Argentina</option><option>Outro</option></select></div><div class="field full"><label for="documento">Documento de identificação (PDF/JPG/PNG)</label><input id="documento" type="file" accept=".pdf,.jpg,.jpeg,.png"></div></div><label class="check-label terms"><input type="checkbox" required> Li e aceito os termos de uso e a política de privacidade.</label><button class="btn btn-lime btn-block" type="submit">Continuar cadastro →</button></form></section></main><script src="js/script.js"></script></body></html>
